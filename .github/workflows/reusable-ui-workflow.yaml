on:
  workflow_call:
    inputs:
      is_pr:
        type: boolean
        default: false
      run_all_ui_tests:
        type: boolean
        default: false
    secrets:
      MSDK_ANDROID_REMOTE_ACCESS_CALLBACK_URL:
        required: true
      MSDK_ANDROID_REMOTE_ACCESS_CONSUMER_KEY:
        required: true
      UI_TEST_CONFIG:
        required: true
      GCLOUD_SERVICE_KEY:
        required: true
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-android:
    runs-on: forcedotcom-ubuntu  # forks: use ubuntu-latest (org-scoped runner)
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/DangerFiles/Gemfile
      # Most used according to https://gs.statcounter.com/android-version-market-share/mobile-tablet/worldwide
      PR_API_VERSION: "36"
      PR_DEVICE_MODEL: "MediumPhone_ps16k.arm"
      FULL_API_RANGE: "31 32 33 34 35 36 37"
      PS16K_MIN_API_VERSION: "36"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ inputs.is_pr }}
        with:
          persist-credentials: false
          # We need a sufficient depth or Danger will occasionally run into issues checking which files were modified.
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ ! inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - name: Install Dependencies
        env:
          MSDK_ANDROID_REMOTE_ACCESS_CALLBACK_URL: ${{ secrets.MSDK_ANDROID_REMOTE_ACCESS_CALLBACK_URL }}
          MSDK_ANDROID_REMOTE_ACCESS_CONSUMER_KEY: ${{ secrets.MSDK_ANDROID_REMOTE_ACCESS_CONSUMER_KEY }}
          UI_TEST_CONFIG: ${{ secrets.UI_TEST_CONFIG }}
        run: |
          ./install.sh
          echo $UI_TEST_CONFIG > ./shared/test/ui_test_config.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          # This is the actual Gradle version (not AGP), which can be found in the gradle-wrapper.properties file.
          gradle-version: "8.14.3"
          add-job-summary: on-failure
          add-job-summary-as-pr-comment: on-failure
      - name: Build App for Testing
        id: build-app
        if: success() || failure()
        run: |
          mkdir -p build_logs
          set -o pipefail
          ./gradlew native:NativeSampleApps:AuthFlowTester:assembleDebug 2>&1 | tee "build_logs/assembleDebug-AuthFlowTester.log"
      - name: Build UI Tests
        id: build-ui-tests
        run: |
          mkdir -p build_logs
          set -o pipefail
          ./gradlew native:NativeSampleApps:AuthFlowTester:assembleAndroidTest 2>&1 | tee "build_logs/assembleAndroidTest-AuthFlowTester.log"
      - name: Archive build logs on failure
        if: failure() && (steps.build-app.outcome == 'failure' || steps.build-ui-tests.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: build-logs-authflowtester-ui
          path: build_logs/
          if-no-files-found: ignore
          retention-days: 14
      - uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed'  # v2.1.13
        if: success() || failure()
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'
      - uses: 'google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f'  # v2.2.1
        if: success() || failure()
      - name: Run PR Smoke Tests
        continue-on-error: true
        if: ${{ inputs.is_pr && !inputs.run_all_ui_tests }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Ordinary PRs run a representative smoke subset, including two multi-user cases.
          # AuthFlowTester-changing PRs skip this step and run every test in the shards below.
          GCLOUD_RESULTS_DIR="authflowtester-pr-build-${RUN_NUMBER}"

          PR_TESTS="class com.salesforce.samples.authflowtester.BootConfigLoginTests#testCAOpaque_DefaultScopes_WebServerFlow, \
            class com.salesforce.samples.authflowtester.ECALoginTests#testECAOpaque_DefaultScopes, \
            class com.salesforce.samples.authflowtester.ECALoginTests#testECAJwt_AllScopes, \
            class com.salesforce.samples.authflowtester.TokenMigrationTest#testMigrate_ECA_AddMoreScopes, \
            class com.salesforce.samples.authflowtester.MultiUserLoginTests#testSameApp_SameScopes_uniqueTokens, \
            class com.salesforce.samples.authflowtester.MultiUserLoginTests#testRetainedUserClient_refreshesWhileOtherUserCurrent, \
            class com.salesforce.samples.authflowtester.BeaconLoginTests#testBeaconOpaque_DefaultScopes, \
            class com.salesforce.samples.authflowtester.AdvancedAuthBeaconLoginTests#testBeaconOpaque_DefaultScopes"

          gcloud firebase test android run \
            --project mobile-apps-firebase-test \
            --type instrumentation \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --app "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk" \
            --test "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/androidTest/debug/AuthFlowTester-debug-androidTest.apk" \
            --device "model=${PR_DEVICE_MODEL},version=${PR_API_VERSION},locale=en,orientation=portrait" \
            --directories-to-pull=/sdcard \
            --results-dir="${GCLOUD_RESULTS_DIR}" \
            --results-history-name=AuthFlowTester \
            --no-performance-metrics \
            --test-targets="${PR_TESTS}" \
            --timeout=10m \
            --num-flaky-test-attempts=1
      - name: Run Login Tests (AuthFlowTester changed in PR)
        continue-on-error: true
        if: ${{ inputs.is_pr && inputs.run_all_ui_tests }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # This is the catch-all shard. New test classes land here automatically unless they are
          # explicitly moved to one of the dedicated whole-class shards below.
          GCLOUD_RESULTS_DIR="authflowtester-pr-login-build-${RUN_NUMBER}"

          gcloud firebase test android run \
            --project mobile-apps-firebase-test \
            --type instrumentation \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --app "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk" \
            --test "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/androidTest/debug/AuthFlowTester-debug-androidTest.apk" \
            --device "model=${PR_DEVICE_MODEL},version=${PR_API_VERSION},locale=en,orientation=portrait" \
            --directories-to-pull=/sdcard \
            --results-dir="${GCLOUD_RESULTS_DIR}" \
            --results-history-name=AuthFlowTester \
            --no-performance-metrics \
            --test-targets "notClass com.salesforce.samples.authflowtester.MultiUserLoginTests,notClass com.salesforce.samples.authflowtester.DPoPLoginTests,notClass com.salesforce.samples.authflowtester.LoginWithRestartTests,notClass com.salesforce.samples.authflowtester.RTRLoginTests,notClass com.salesforce.samples.authflowtester.RefreshTokenMigrationTests,notClass com.salesforce.samples.authflowtester.WelcomeLoginTests" \
            --timeout=60m \
            --num-flaky-test-attempts=1
      - name: Run Welcome Discovery Tests (AuthFlowTester changed in PR)
        continue-on-error: true
        if: ${{ inputs.is_pr && inputs.run_all_ui_tests }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # NegativeLoginTests intentionally finishes with Chrome displaying an OAuth error.
          # Keep Welcome tests in a fresh execution so delayed task cleanup cannot kill them.
          GCLOUD_RESULTS_DIR="authflowtester-pr-welcome-build-${RUN_NUMBER}"

          gcloud firebase test android run \
            --project mobile-apps-firebase-test \
            --type instrumentation \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --app "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk" \
            --test "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/androidTest/debug/AuthFlowTester-debug-androidTest.apk" \
            --device "model=${PR_DEVICE_MODEL},version=${PR_API_VERSION},locale=en,orientation=portrait" \
            --directories-to-pull=/sdcard \
            --results-dir="${GCLOUD_RESULTS_DIR}" \
            --results-history-name=AuthFlowTester \
            --no-performance-metrics \
            --test-targets "class com.salesforce.samples.authflowtester.WelcomeLoginTests" \
            --timeout=10m \
            --num-flaky-test-attempts=1
      - name: Run Token Lifecycle Tests (AuthFlowTester changed in PR)
        continue-on-error: true
        if: ${{ inputs.is_pr && inputs.run_all_ui_tests }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Select whole classes rather than individual methods, so new tests in these classes are
          # included automatically. New classes remain covered by the catch-all login shard.
          GCLOUD_RESULTS_DIR="authflowtester-pr-token-lifecycle-build-${RUN_NUMBER}"

          gcloud firebase test android run \
            --project mobile-apps-firebase-test \
            --type instrumentation \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --app "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk" \
            --test "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/androidTest/debug/AuthFlowTester-debug-androidTest.apk" \
            --device "model=${PR_DEVICE_MODEL},version=${PR_API_VERSION},locale=en,orientation=portrait" \
            --directories-to-pull=/sdcard \
            --results-dir="${GCLOUD_RESULTS_DIR}" \
            --results-history-name=AuthFlowTester \
            --no-performance-metrics \
            --test-targets "class com.salesforce.samples.authflowtester.DPoPLoginTests,class com.salesforce.samples.authflowtester.LoginWithRestartTests,class com.salesforce.samples.authflowtester.RTRLoginTests,class com.salesforce.samples.authflowtester.RefreshTokenMigrationTests" \
            --timeout=60m \
            --num-flaky-test-attempts=1
      - name: Run All Multi User Tests (AuthFlowTester changed in PR)
        continue-on-error: true
        if: ${{ inputs.is_pr && inputs.run_all_ui_tests }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Unlike the mutually exclusive PR smoke step, this runs the complete multi-user class.
          GCLOUD_RESULTS_DIR="authflowtester-pr-multi-user-build-${RUN_NUMBER}"

          gcloud firebase test android run \
            --project mobile-apps-firebase-test \
            --type instrumentation \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --app "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk" \
            --test "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/androidTest/debug/AuthFlowTester-debug-androidTest.apk" \
            --device "model=${PR_DEVICE_MODEL},version=${PR_API_VERSION},locale=en,orientation=portrait" \
            --directories-to-pull=/sdcard \
            --results-dir="${GCLOUD_RESULTS_DIR}" \
            --results-history-name=AuthFlowTester \
            --no-performance-metrics \
            --test-targets "class com.salesforce.samples.authflowtester.MultiUserLoginTests" \
            --timeout=45m \
            --num-flaky-test-attempts=1
      - name: Run All Single User Tests
        continue-on-error: true
        if: ${{ ! inputs.is_pr }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          GCLOUD_RESULTS_DIR="authflowtester-single-user-build-${RUN_NUMBER}"
          DEVICE_ARGS=()
          for LEVEL in $FULL_API_RANGE; do
            DEVICE_MODEL="MediumPhone.arm"
            if [ "$PS16K_MIN_API_VERSION" -le "$LEVEL" ]; then
              DEVICE_MODEL="MediumPhone_ps16k.arm"
            fi
            DEVICE_ARGS+=(--device "model=${DEVICE_MODEL},version=${LEVEL},locale=en,orientation=portrait")
          done

          gcloud firebase test android run \
            --project mobile-apps-firebase-test \
            --type instrumentation \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --app "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk" \
            --test "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/androidTest/debug/AuthFlowTester-debug-androidTest.apk" \
            --test-targets "notClass com.salesforce.samples.authflowtester.MultiUserLoginTests" \
            "${DEVICE_ARGS[@]}" \
            --directories-to-pull=/sdcard \
            --results-dir="${GCLOUD_RESULTS_DIR}" \
            --results-history-name=AuthFlowTester \
            --no-performance-metrics \
            --num-flaky-test-attempts=1 \
            --timeout=60m || true
      - name: Run All Multi User Tests
        continue-on-error: true
        if: ${{ ! inputs.is_pr }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          GCLOUD_RESULTS_DIR="authflowtester-multi-user-build-${RUN_NUMBER}"
          DEVICE_ARGS=()
          for LEVEL in $FULL_API_RANGE; do
            DEVICE_MODEL="MediumPhone.arm"
            if [ "$PS16K_MIN_API_VERSION" -le "$LEVEL" ]; then
              DEVICE_MODEL="MediumPhone_ps16k.arm"
            fi
            DEVICE_ARGS+=(--device "model=${DEVICE_MODEL},version=${LEVEL},locale=en,orientation=portrait")
          done

          gcloud firebase test android run \
            --project mobile-apps-firebase-test \
            --type instrumentation \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --app "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk" \
            --test "native/NativeSampleApps/AuthFlowTester/build/outputs/apk/androidTest/debug/AuthFlowTester-debug-androidTest.apk" \
            --test-targets "class com.salesforce.samples.authflowtester.MultiUserLoginTests" \
            "${DEVICE_ARGS[@]}" \
            --directories-to-pull=/sdcard \
            --results-dir="${GCLOUD_RESULTS_DIR}" \
            --results-history-name=AuthFlowTester \
            --no-performance-metrics \
            --num-flaky-test-attempts=1 \
            --timeout=30m || true
      - name: Copy Test Results
        continue-on-error: true
        if: success() || failure()
        env:
          IS_PR: ${{ inputs.is_pr }}
          RUN_ALL_UI_TESTS: ${{ inputs.run_all_ui_tests }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p firebase_results
          BUCKET="gs://test-lab-w87i9sz6q175u-kwp8ium6js0zw"

          copy_results_by_api_level() {
            local BUCKET_PATH=$1
            local OUTPUT_PREFIX=$2

            # Pass 1: copy original (non-rerun) results
            for RESULT_FILE in $(gsutil ls "${BUCKET_PATH}/*/test_result_1.xml" 2>/dev/null | grep -v "rerun"); do
              DEVICE_DIR=$(echo "${RESULT_FILE}" | sed 's|.*/\([^/]*\)/test_result_1.xml|\1|')
              API_LEVEL=$(echo "${DEVICE_DIR}" | sed 's/.*-\([0-9]*\)-.*/\1/')
              EXECUTION_DIR="${RESULT_FILE%/test_result_1.xml}"
              gsutil cp "${RESULT_FILE}" "firebase_results/${OUTPUT_PREFIX}_api_${API_LEVEL}_test_result.xml"
              gsutil cp "${EXECUTION_DIR}/instrumentation.results" \
                "firebase_results/${OUTPUT_PREFIX}_api_${API_LEVEL}_instrumentation.results"
            done
            # Pass 2: merge failed and missing rerun cases. A crashed orchestrator process can
            # omit a test from the original XML entirely even though AndroidJUnitRunner found it.
            for RESULT_FILE in $(gsutil ls "${BUCKET_PATH}/*/test_result_1.xml" 2>/dev/null | grep "rerun"); do
              DEVICE_DIR=$(echo "${RESULT_FILE}" | sed 's|.*/\([^/]*\)/test_result_1.xml|\1|')
              API_LEVEL=$(echo "${DEVICE_DIR}" | sed 's/.*-\([0-9]*\)-.*/\1/')
              RERUN_TMP="firebase_results/${OUTPUT_PREFIX}_api_${API_LEVEL}_rerun_tmp.xml"
              ORIG_FILE="firebase_results/${OUTPUT_PREFIX}_api_${API_LEVEL}_test_result.xml"
              gsutil cp "${RESULT_FILE}" "${RERUN_TMP}"
              python3 - "${ORIG_FILE}" "${RERUN_TMP}" "${ORIG_FILE}" << 'PYEOF'
          import sys, xml.etree.ElementTree as ET
          orig = ET.parse(sys.argv[1])
          rerun = ET.parse(sys.argv[2])
          def suite(t):
            r = t.getroot()
            return r if r.tag == 'testsuite' else r.find('testsuite')
          os_el, rs_el = suite(orig), suite(rerun)
          failed_keys = set()
          existing_keys = set()
          for tc in os_el.findall('testcase'):
            key = f"{tc.get('name','')}|{tc.get('classname','')}|{tc.get('file','')}"
            existing_keys.add(key)
            if tc.find('failure') is not None or tc.find('error') is not None:
              failed_keys.add(key)
          added = 0
          for tc in rs_el.findall('testcase'):
            key = f"{tc.get('name','')}|{tc.get('classname','')}|{tc.get('file','')}"
            if key in failed_keys or key not in existing_keys:
              os_el.append(tc)
              existing_keys.add(key)
              added += 1
          os_el.set('tests', str(int(os_el.get('tests','0')) + added))
          with open(sys.argv[3], 'w') as f:
            f.write(ET.tostring(orig.getroot(), encoding='unicode'))
          PYEOF
              rm "${RERUN_TMP}"
            done
          }

          if [ "$IS_PR" = "true" ] ; then
            if [ "$RUN_ALL_UI_TESTS" = "true" ] ; then
              PR_LOGIN_PATH="${BUCKET}/authflowtester-pr-login-build-${RUN_NUMBER}"
              if gsutil ls "${PR_LOGIN_PATH}" > /dev/null 2>&1; then
                copy_results_by_api_level "${PR_LOGIN_PATH}" "pr-login"
              fi

              PR_WELCOME_PATH="${BUCKET}/authflowtester-pr-welcome-build-${RUN_NUMBER}"
              if gsutil ls "${PR_WELCOME_PATH}" > /dev/null 2>&1; then
                copy_results_by_api_level "${PR_WELCOME_PATH}" "pr-welcome"
              fi

              PR_TOKEN_PATH="${BUCKET}/authflowtester-pr-token-lifecycle-build-${RUN_NUMBER}"
              if gsutil ls "${PR_TOKEN_PATH}" > /dev/null 2>&1; then
                copy_results_by_api_level "${PR_TOKEN_PATH}" "pr-token-lifecycle"
              fi

              PR_MULTI_PATH="${BUCKET}/authflowtester-pr-multi-user-build-${RUN_NUMBER}"
              if gsutil ls "${PR_MULTI_PATH}" > /dev/null 2>&1; then
                copy_results_by_api_level "${PR_MULTI_PATH}" "pr-multi-user"
              fi
            else
              PR_PATH="${BUCKET}/authflowtester-pr-build-${RUN_NUMBER}"
              if gsutil ls "${PR_PATH}" > /dev/null 2>&1; then
                copy_results_by_api_level "${PR_PATH}" "pr"
              fi
            fi
          else
            SINGLE_PATH="${BUCKET}/authflowtester-single-user-build-${RUN_NUMBER}"
            if gsutil ls "${SINGLE_PATH}" > /dev/null 2>&1; then
              copy_results_by_api_level "${SINGLE_PATH}" "single-user"
            fi

            MULTI_PATH="${BUCKET}/authflowtester-multi-user-build-${RUN_NUMBER}"
            if gsutil ls "${MULTI_PATH}" > /dev/null 2>&1; then
              copy_results_by_api_level "${MULTI_PATH}" "multi-user"
            fi
          fi
      - name: Validate Complete PR Test Results
        if: ${{ !cancelled() && inputs.is_pr && inputs.run_all_ui_tests }}
        run: |
          python3 - << 'PYEOF'
          import glob
          import re
          import sys
          import xml.etree.ElementTree as ET

          expected_prefixes = {"pr-login", "pr-welcome", "pr-token-lifecycle", "pr-multi-user"}
          instrumentation_files = glob.glob("firebase_results/*_instrumentation.results")
          found_prefixes = set()
          errors = []

          for instrumentation_file in instrumentation_files:
              output_prefix = re.sub(r"_api_\d+_instrumentation\.results$", "", instrumentation_file.split("/")[-1])
              if output_prefix not in expected_prefixes:
                  continue
              found_prefixes.add(output_prefix)

              xml_file = instrumentation_file.replace("_instrumentation.results", "_test_result.xml")
              try:
                  instrumentation = open(instrumentation_file).read()
                  expected_counts = [int(value) for value in re.findall(r"numtests=(\d+)", instrumentation)]
                  if not expected_counts:
                      raise ValueError("missing AndroidJUnitRunner numtests value")

                  root = ET.parse(xml_file).getroot()
                  test_keys = {
                      (tc.get("classname", ""), tc.get("name", ""), tc.get("file", ""))
                      for tc in root.iter("testcase")
                  }
                  expected_count = max(expected_counts)
                  if len(test_keys) < expected_count:
                      errors.append(
                          f"{output_prefix}: AndroidJUnitRunner found {expected_count} tests, "
                          f"but Firebase reported only {len(test_keys)} unique test cases"
                      )
              except (OSError, ET.ParseError, ValueError) as error:
                  errors.append(f"{output_prefix}: could not validate complete results: {error}")

          missing_prefixes = expected_prefixes - found_prefixes
          if missing_prefixes:
              errors.append("missing result groups: " + ", ".join(sorted(missing_prefixes)))

          if errors:
              print("Incomplete Firebase Test Lab results:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              sys.exit(1)

          print("All Firebase Test Lab result groups contain every discovered test case.")
          PYEOF
      - name: Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        if: success() || failure()
        with:
          check_name: AuthFlowTester Test Results
          job_name: AuthFlowTester Test Results
          require_tests: true
          check_retries: true
          flaky_summary: true
          fail_on_failure: true
          group_reports: false
          include_passed: true
          include_empty_in_summary: false
          simplified_summary: true
          report_paths: 'firebase_results/**.xml'
      - name: Archive APK
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: AuthFlowTester-debug-${{ github.run_number }}
          path: native/NativeSampleApps/AuthFlowTester/build/outputs/apk/debug/AuthFlowTester-debug.apk
      - name: Archive Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: success() || failure()
        with:
          name: ui-test-results
          path: 'firebase_results/**.xml'
